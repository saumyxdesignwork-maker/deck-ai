<section class="slide a-section v-burst" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  {{/if}}
  <div class="sb-main" data-region="main">
    <div class="sb-burst" data-decor="burst"></div>
    {{#if content.number}}<p class="sb-number t-label" data-slot="content.number" data-slot-type="text" data-nowrap>{{content.number}}</p>{{/if}}
    <h2 class="sb-title t-display-0" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-2">{{rich content.title}}</h2>
  </div>
  <figure class="sb-band" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{/if}}</figure>
  {{#if content.kicker}}<p class="sb-kicker t-title" data-slot="content.kicker" data-slot-type="text" data-fit="shrink" data-min-step="label">{{content.kicker}}</p>{{/if}}
  <div class="sb-zig" data-decor="zig"></div>
  <div data-decor="edge"></div>
</section>

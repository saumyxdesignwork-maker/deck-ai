<section class="slide a-section v-centered" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <div class="sc-main" data-region="main">
    {{#if content.number}}<p class="sc-number t-label" data-slot="content.number" data-slot-type="text" data-nowrap>{{content.number}}</p>{{/if}}
    <h2 class="sc-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h2>
    {{#if content.kicker}}<p class="sc-kicker t-body" data-slot="content.kicker" data-slot-type="text">{{content.kicker}}</p>{{/if}}
  </div>
  <div data-decor="edge"></div>
</section>

<section class="slide a-closing v-block-checker" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  <div class="ck-grid">
    <div class="ck-cell ck-cell--a"></div>
    <figure class="ck-cell ck-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
    <div class="ck-cell ck-cell--b"><div class="ck-burst" data-decor="burst"></div></div>
    <div class="ck-cell ck-cell--c"></div>
  </div>
  <div class="ck-main" data-region="main">
    <h2 class="ck-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h2>
    {{#if content.body}}<p class="ck-body t-title" data-slot="content.body" data-slot-type="text" data-fit="shrink" data-min-step="label">{{content.body}}</p>{{/if}}
    {{#if content.contact}}<p class="ck-contact t-label" data-slot="content.contact" data-slot-type="text">{{content.contact}}</p>{{/if}}
  </div>
  <div data-decor="edge"></div>
</section>

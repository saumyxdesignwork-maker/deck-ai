<section class="slide a-title v-full-bleed-photo" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  <figure class="fb-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
  <div class="fb-main" data-region="main">
    <h1 class="fb-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h1>
    {{#if content.subtitle}}<p class="fb-subtitle t-caption" data-slot="content.subtitle" data-slot-type="text">{{content.subtitle}}</p>{{/if}}
  </div>
  <div class="fb-meta">
    {{#if content.eyebrow}}<span class="t-caption" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</span>{{/if}}
    {{#if content.byline}}<span class="t-caption" data-slot="content.byline" data-slot-type="text">{{content.byline}}</span>{{/if}}
    {{#if content.date}}<span class="t-caption" data-slot="content.date" data-slot-type="text">{{content.date}}</span>{{/if}}
  </div>
  <div data-decor="edge"></div>
</section>

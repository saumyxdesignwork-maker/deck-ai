<section class="slide a-title v-block-collage" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  <div class="bc-art">
    <div class="bc-block bc-block--a"></div>
    <div class="bc-block bc-block--b"></div>
    <figure class="bc-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
    <div class="bc-block bc-block--c"></div>
  </div>
  <div class="bc-main" data-region="main">
    {{#if content.eyebrow}}<p class="bc-eyebrow t-label" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</p>{{/if}}
    <h1 class="bc-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h1>
    {{#if content.subtitle}}<p class="bc-sub t-title" data-slot="content.subtitle" data-slot-type="text" data-fit="shrink" data-min-step="label">{{content.subtitle}}</p>{{/if}}
    <div class="bc-meta">
      {{#if content.byline}}<span class="t-caption" data-slot="content.byline" data-slot-type="text">{{content.byline}}</span>{{/if}}
      {{#if content.date}}<span class="t-caption" data-slot="content.date" data-slot-type="text">{{content.date}}</span>{{/if}}
    </div>
  </div>
  <div class="bc-burst" data-decor="burst"></div>
  <div data-decor="edge"></div>
</section>

<section class="slide a-title v-ring" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div class="rg-ring" data-decor="ring"></div>
  <div class="rt-meta">
    {{#if content.date}}<span class="rt-date t-caption" data-slot="content.date" data-slot-type="text" data-nowrap>{{content.date}}</span>{{/if}}
    {{#if content.eyebrow}}<span class="rt-eyebrow t-caption" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</span>{{/if}}
  </div>
  <div class="rt-main" data-region="main">
    <h1 class="rt-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h1>
    {{#if content.subtitle}}<p class="rt-subtitle t-body-s" data-slot="content.subtitle" data-slot-type="text">{{content.subtitle}}</p>{{/if}}
  </div>
  {{#if content.byline}}<p class="rt-byline t-caption" data-slot="content.byline" data-slot-type="text">{{content.byline}}</p>{{/if}}
  <div data-decor="edge"></div>
</section>

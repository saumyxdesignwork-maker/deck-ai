<section class="slide a-title v-type-only" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  <div data-decor="corner-tl"></div>
  <div class="tt-main" data-region="main">
    {{#if content.eyebrow}}<p class="tt-eyebrow t-label" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</p>{{/if}}
    <h1 class="tt-title t-display-1" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h1>
    {{#if content.subtitle}}<p class="tt-subtitle t-lead" data-slot="content.subtitle" data-slot-type="text" data-fit="shrink" data-min-step="body">{{content.subtitle}}</p>{{/if}}
  </div>
  {{#if content.date}}<p class="tt-date t-label" data-slot="content.date" data-slot-type="text">{{content.date}}</p>{{/if}}
  {{#if content.byline}}<p class="tt-byline t-label" data-slot="content.byline" data-slot-type="text">{{content.byline}}</p>{{/if}}
  <div data-decor="edge"></div>
</section>

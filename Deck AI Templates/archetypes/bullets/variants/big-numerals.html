<section class="slide a-bullets v-big-numerals" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <figure class="bn-card" data-slot="content.image" data-slot-type="image">
    {{#if content.image}}<img class="bn-img" src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="bn-placeholder" data-decor="photo"></div>{{/if}}
    <figcaption class="bn-caption">
      {{#if content.eyebrow}}<span class="t-caption" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</span>{{/if}}
      {{#if content.intro}}<span class="bn-intro t-title" data-slot="content.intro" data-slot-type="text">{{content.intro}}</span>{{/if}}
    </figcaption>
  </figure>
  <div class="bn-right">
    {{#if content.title}}<h2 class="bn-title t-display-3" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="title">{{rich content.title}}</h2>{{/if}}
    <ol class="bn-items" data-region="items" data-slot="content.items" data-slot-type="list" data-min="2" data-max="4">
      {{#each content.items}}
      <li class="bn-item" data-slot-item="{{@index}}">
        <span class="bn-num t-display-0" aria-hidden="true"></span>
        <span class="bn-name t-title" data-slot="content.items[{{@index}}].title" data-slot-type="text" data-fit="shrink" data-min-step="body-s">{{title}}</span>
        {{#if text}}<span class="bn-text t-body-s" data-slot="content.items[{{@index}}].text" data-slot-type="text" data-fit="shrink" data-min-step="caption">{{text}}</span>{{/if}}
      </li>
      {{/each}}
    </ol>
  </div>
  <div data-decor="edge"></div>
</section>

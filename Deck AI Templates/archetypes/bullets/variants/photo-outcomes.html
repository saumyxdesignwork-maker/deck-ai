<section class="slide a-bullets v-photo-outcomes" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <figure class="po-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
  <div class="po-titlecell"><div class="pl-tw"><h2 class="pl-title t-display-2" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h2><div class="pl-mark" data-decor="title-mark"></div></div>{{#if content.intro}}<p class="t-caption po-intro" data-slot="content.intro" data-slot-type="text">{{content.intro}}</p>{{/if}}</div>
  <ol class="po-items" data-region="items" data-slot="content.items" data-slot-type="list" data-min="4" data-max="6">
    {{#each content.items}}
    <li class="po-item" data-slot-item="{{@index}}">
      <span class="t-title" data-slot="content.items[{{@index}}].title" data-slot-type="text">{{title}}</span>
      {{#if text}}<span class="t-caption po-text" data-slot="content.items[{{@index}}].text" data-slot-type="text" data-fit="shrink" data-min-step="caption">{{text}}</span>{{/if}}
    </li>
    {{/each}}
  </ol>
  <div data-decor="edge"></div>
</section>

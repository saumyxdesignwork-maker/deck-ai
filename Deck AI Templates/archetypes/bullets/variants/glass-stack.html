<section class="slide a-bullets v-glass-stack" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <div class="gk-left" data-region="left">
    {{#if content.eyebrow}}<p class="t-label" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</p>{{/if}}
    <h2 class="gk-title t-display-2" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h2>
    {{#if content.intro}}<p class="gk-intro t-body-s" data-slot="content.intro" data-slot-type="text">{{content.intro}}</p>{{/if}}
  </div>
  <ol class="gk-items" data-region="items" data-slot="content.items" data-slot-type="list" data-min="2" data-max="4">
    {{#each content.items}}
    <li class="gk-card{{#if emphasis}} is-emphasis{{/if}}" data-slot-item="{{@index}}">
      <span class="gk-tag t-caption" aria-hidden="true"></span>
      <span class="gk-name t-title" data-slot="content.items[{{@index}}].title" data-slot-type="text" data-fit="shrink" data-min-step="body-s">{{title}}</span>
      {{#if text}}<span class="gk-text t-body-s" data-slot="content.items[{{@index}}].text" data-slot-type="text" data-fit="shrink" data-min-step="caption">{{text}}</span>{{/if}}
    </li>
    {{/each}}
  </ol>
  <div data-decor="edge"></div>
</section>

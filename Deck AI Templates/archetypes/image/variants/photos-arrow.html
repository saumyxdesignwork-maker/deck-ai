<section class="slide a-image v-photos-arrow" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <div class="pa-photos" data-slot="content.images" data-slot-type="images">{{#if content.images}}{{#each content.images}}<figure class="pa-tile"><img src="{{src}}" alt="{{alt}}" style="object-position: {{pos}}" /></figure>{{/each}}{{else}}<figure class="pa-tile"><div class="ph" data-decor="photo"></div></figure><figure class="pa-tile"><div class="ph" data-decor="photo"></div></figure>{{/if}}</div>
  <div class="pa-titlerow"><div class="pa-arrow" data-decor="arrow"></div><h2 class="pa-title t-display-2" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-nowrap data-min-step="display-3">{{rich content.title}}</h2></div>
  <div class="pa-text" data-region="text">
    <div data-slot="content.body" data-slot-type="paragraphs">{{#each content.body}}<p class="t-body-s" data-slot="content.body[{{@index}}]" data-slot-type="text">{{this}}</p>{{/each}}</div>
    {{#if content.eyebrow}}<p class="t-title" data-slot="content.eyebrow" data-slot-type="text">{{content.eyebrow}}</p>{{/if}}
  </div>
  <div data-decor="edge"></div>
</section>

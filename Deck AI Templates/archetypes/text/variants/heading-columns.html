<section class="slide a-text v-heading-columns" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <div class="hc-head">
    <div class="pl-tw"><h2 class="pl-title t-display-2" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-min-step="display-3">{{rich content.title}}</h2><div class="pl-mark" data-decor="title-mark"></div></div>
    {{#if content.lead}}<p class="hc-lead t-title" data-slot="content.lead" data-slot-type="text">{{content.lead}}</p>{{/if}}
  </div>
  <div class="hc-body" data-region="body" data-slot="content.body" data-slot-type="paragraphs">{{#each content.body}}<p class="t-body-s" data-slot="content.body[{{@index}}]" data-slot-type="text" data-fit="shrink" data-min-step="caption">{{this}}</p>{{/each}}</div>
  <figure class="hc-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
  <div data-decor="edge"></div>
</section>

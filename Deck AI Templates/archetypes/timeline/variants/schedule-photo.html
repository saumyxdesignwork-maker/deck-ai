<section class="slide a-timeline v-schedule-photo" data-slide-id="{{id}}" data-ground="{{ground}}" data-density="{{density}}" data-aspect="{{aspect}}">
  <div data-decor="frame"></div>
  {{#if show_chrome}}
  <header class="chrome chrome--top"><span class="t-caption" data-slot="meta.running_label" data-slot-type="text" data-editable="deck">{{meta.running_label}}</span></header>
  <footer class="chrome chrome--bottom"><span class="t-caption">{{page}}</span></footer>
  {{/if}}
  <div class="sch-left" data-region="left">
    {{#if content.title}}<h2 class="sch-title t-display-0" data-slot="content.title" data-slot-type="rich" data-fit="shrink" data-nowrap data-min-step="display-1">{{rich content.title}}</h2>{{/if}}
    {{#if content.intro}}<p class="sch-intro t-caption" data-slot="content.intro" data-slot-type="text">{{content.intro}}</p>{{/if}}
    <ol class="sch-items" data-slot="content.items" data-slot-type="list" data-min="3" data-max="5" style="--item-count: {{content.items.length}}">
      {{#each content.items}}
      <li class="sch-item{{#if emphasis}} is-emphasis{{/if}}" data-slot-item="{{@index}}">
        {{#if date}}<span class="t-caption" data-slot="content.items[{{@index}}].date" data-slot-type="text">{{date}}</span>{{/if}}
        <span class="sch-label t-caption" data-slot="content.items[{{@index}}].label" data-slot-type="text">{{label}}</span>
        {{#if text}}<span class="sch-text t-caption" data-slot="content.items[{{@index}}].text" data-slot-type="text">{{text}}</span>{{/if}}
      </li>
      {{/each}}
    </ol>
  </div>
  <figure class="sch-photo" data-slot="content.image" data-slot-type="image">{{#if content.image}}<img src="{{content.image.src}}" alt="{{content.image.alt}}" style="object-position: {{content.image.pos}}" />{{else}}<div class="ph" data-decor="photo"></div>{{/if}}</figure>
  <div data-decor="edge"></div>
</section>

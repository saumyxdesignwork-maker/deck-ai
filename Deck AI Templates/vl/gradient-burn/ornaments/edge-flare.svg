      <stop offset="0" style="stop-color: var(--r-field-heat-1)" stop-opacity="1"/>
      <stop offset="0.3" style="stop-color: var(--r-field-heat-0)" stop-opacity="0.9"/>
      <stop offset="0.58" style="stop-color: var(--r-field-cool-0)" stop-opacity="0.45"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" overflow="visible">
  <defs>
    <linearGradient id="hue" x1="120" y1="80" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--color-glow-a)"/>
      <stop offset="0.5" style="stop-color: var(--color-glow-b)"/>
      <stop offset="1" style="stop-color: var(--color-emphasis)"/>
    </linearGradient>
    <radialGradient id="halo" cx="500" cy="500" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0.7" style="stop-color: var(--color-glow-a)" stop-opacity="0"/>
      <stop offset="0.86" style="stop-color: var(--color-glow-a)" stop-opacity="0.55"/>
      <stop offset="1" style="stop-color: var(--color-glow-a)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="560" cy="520" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0.82" style="stop-color: var(--slide-bg)" stop-opacity="1"/>
      <stop offset="1" style="stop-color: var(--slide-bg)" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <circle cx="500" cy="500" r="560" fill="url(#halo)"/>
  <circle cx="500" cy="500" r="470" fill="url(#hue)" filter="url(#soft)"/>
  <circle cx="500" cy="500" r="470" fill="url(#hue)"/>
  <!-- the black disk sits off-centre so the glow reads as a crescent, thicker on the left -->
  <circle cx="548" cy="512" r="418" fill="url(#shade)"/>
</svg>
